##############################################################################
# bitbucket-pipelines.yml
#
# CI/CD Pipeline for pg_vault_tde — Bitbucket Cloud
#
# Delegates all build and test logic to the containerised local pipeline
# (ci/scripts/run-all.sh) via `make ci-all`.
#
##############################################################################
image: ubuntu:24.04

definitions:
  caches:
    apt-pgdg: /var/cache/apt
  services:
    docker:
      memory: 7128

  steps:
    - step: &test-pg-17
        name: Testing — PostgreSQL 17
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends ca-certificates curl wget
          # Docker Compose
          - curl -fsSL https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          - chmod +x /usr/local/bin/docker-compose
          # Run test
          - export PG_VERSION=17
          - bash ci/scripts/run-all.sh $TEST_RUNALL_OPTIONS

    - step: &test-pg-18
        name: Testing — PostgreSQL 18
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends ca-certificates curl wget
          # Docker Compose
          - curl -fsSL https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          - chmod +x /usr/local/bin/docker-compose
          # Run test
          - export PG_VERSION=18
          - bash ci/scripts/run-all.sh $TEST_RUNALL_OPTIONS

    - step: &package
        name: Build and Package Artifacts
        size: 2x
        services:
          - docker
        script:
          - bash packaging/build_in_container.sh --all
        artifacts:
          - dist/**

    - step: &inspect-artifacts
        name: Inspect Artifacts
        script:
          - ls -la dist/

    - step: &github-synchronization
        # NB: usare solo con il branch che poi si vorrà replicare
        name:
        script:
          - apt-get update && apt-get install -y rsync git openssh-client
          - git clone --depth 1 $GITHUB_REPO_URL github-repo
          # Sincronizza file o directory di interesse
          - >
            rsync -av --delete 
            --exclude='.git/' 
            --exclude='github-repo/' 
            --exclude='tmp_pgext/' 
            --exclude='ci/' 
            --exclude='packaging/' 
            --exclude='bitbucket-pipelines.yml' 
            ./ github-repo/
          # Git config
          - cd github-repo
          - git config user.name "Bitbucket Service Sync"
          - git config user.email "bitbucket-sync@miriade.it"
          # Git commit and push
          - git add .
          - git diff-index --quiet HEAD || git commit -m "Sync directory da Bitbucket"
          - git push origin main


pipelines:
  branches:
    feature/pipeline-ci:
      # - parallel:
      #     - step: *test-pg-17
      #     - step: *test-pg-18
      # - step: *package
      # - step: *inspect-artifacts
      - step: *github-synchronization

    develop:
      - parallel:
          - step: *test-pg-17
          - step: *test-pg-18

    master:
      - parallel:
          - step: *test-pg-17
          - step: *test-pg-18