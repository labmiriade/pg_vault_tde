##############################################################################
# bitbucket-pipelines.yml
#
# CI/CD Pipeline for pg_vault_tde — Bitbucket Cloud
#
# Delegates all build and test logic to the containerised local pipeline
# (ci/scripts/run-all.sh) via `make ci-all`.
#
##############################################################################
image: ubuntu:24.04

definitions:
  caches:
    apt-pgdg: /var/cache/apt
  services:
    docker:
      memory: 7128

  steps:
    - step: &test-pg-17
        name: Testing — PostgreSQL 17
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends ca-certificates curl wget
          # Docker Compose
          - curl -fsSL https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          - chmod +x /usr/local/bin/docker-compose
          # Run test
          - export PG_VERSION=17
          - bash ci/scripts/run-all.sh $TEST_RUNALL_OPTIONS

    - step: &test-pg-18
        name: Testing — PostgreSQL 18
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends ca-certificates curl wget
          # Docker Compose
          - curl -fsSL https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          - chmod +x /usr/local/bin/docker-compose
          # Run test
          - export PG_VERSION=18
          - bash ci/scripts/run-all.sh $TEST_RUNALL_OPTIONS

    - step: &package
        name: Build and Package Artifacts
        size: 2x
        services:
          - docker
        script:
          - bash packaging/build_in_container.sh --all
        artifacts:
          - dist/**

    - step: &inspect-artifacts
        name: Inspect Artifacts
        script:
          - ls -la dist/

    - step: &github-synchronization
        # Sincronizza su GitHub: master->main, develop->develop, tag di versione (v*)->tag omonimo
        # Mirror reale (storia, autori, messaggi preservati) a partire da GITHUB_HISTORY_SINCE,
        # filtrando via git-filter-repo i path non destinati al repo pubblico (ci/, bitbucket-pipelines.yml).
        name: GitHub Synchronization
        clone:
          depth: full
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends git openssh-client ca-certificates python3-pip
          - pip install --break-system-packages --quiet git-filter-repo
          # Determina il ref di destinazione su GitHub in base al trigger Bitbucket
          - |
            if [ -n "$BITBUCKET_TAG" ]; then
              export TARGET_TYPE="tag"
              export TARGET_REF="$BITBUCKET_TAG"
            elif [ "$BITBUCKET_BRANCH" = "master" ]; then
              export TARGET_TYPE="branch"
              export TARGET_REF="main"
            else
              export TARGET_TYPE="branch"
              export TARGET_REF="$BITBUCKET_BRANCH"
            fi
            echo "Sync -> $TARGET_TYPE $TARGET_REF"
          # Esclude ogni commit precedente a GITHUB_HISTORY_SINCE in base alla propria data di
          # commit, non in base alla posizione nel grafo: su rami non lineari (merge, PR,
          # merge da/verso altri branch) un taglio basato sul solo primo genitore del commit più
          # vecchio lascerebbe entrare storia più vecchia arrivata da un altro genitore del merge.
          # Deterministico: a parità di storia sorgente e di cutoff produce sempre lo stesso
          # insieme di commit esclusi, quindi il push verso GitHub resta un fast-forward.
          - |
            export GITHUB_HISTORY_SINCE="${GITHUB_HISTORY_SINCE:-2026-07-01}"
            CUTOFF_TS=$(date -d "$GITHUB_HISTORY_SINCE" +%s)
            OLD_COMMITS=$(git rev-list HEAD --pretty='format:%H %ct' | grep -v '^commit' \
              | awk -v c="$CUTOFF_TS" '$2 < c {print $1}')
            if [ -z "$OLD_COMMITS" ]; then
              echo "Nessun commit precedente a $GITHUB_HISTORY_SINCE su questo ref, sincronizzo l'intera storia disponibile."
              export FILTER_REFS=""
            else
              echo "Esclusi $(echo "$OLD_COMMITS" | wc -l) commit precedenti a $GITHUB_HISTORY_SINCE (per data di commit propria)."
              # "--not" non è utilizzabile qui: l'nargs='+' di argparse in git-filter-repo
              # interrompe la raccolta dei valori di --refs al primo token che inizia per "-",
              # quindi "--not" verrebbe scartato come opzione non riconosciuta ("unrecognized
              # arguments"). Il prefisso "^<rev>" ha la stessa semantica di "--not <rev>" per una
              # singola revisione ma non inizia per "-", quindi resta un valore valido per --refs.
              export FILTER_REFS="HEAD $(echo "$OLD_COMMITS" | sed 's/^/^/')"
            fi
          # Riscrive la storia rimuovendo i path interni e troncandola a GITHUB_HISTORY_SINCE,
          # mantenendo autori/messaggi/date reali per i commit inclusi.
          # Deterministico: a parità di storia sorgente e di cutoff produce sempre gli stessi SHA
          # filtrati, quindi il push verso GitHub resta un fast-forward, senza bisogno di un
          # commit-map persistito.
          - |
            if [ -n "$FILTER_REFS" ]; then
              # $FILTER_REFS is intentionally unquoted: --refs (argparse nargs='+') needs "HEAD"
              # and each "^hash" as separate argv tokens. Quoting it would keep the embedded
              # newlines from OLD_COMMITS, collapsing everything into a single argument that git
              # can't resolve as a revision and then fails to stat as a path ("File name too
              # long") once there are enough excluded commits.
              # shellcheck disable=SC2086
              git filter-repo --force --invert-paths \
                --path ci \
                --path bitbucket-pipelines.yml \
                --refs $FILTER_REFS
            else
              git filter-repo --force --invert-paths \
                --path ci \
                --path bitbucket-pipelines.yml
            fi
          - git remote add github "$GITHUB_REPO_URL"
          # Push del ref reale (storia intatta) verso GitHub
          - |
            if [ "$TARGET_TYPE" = "branch" ]; then
              git push github --force "HEAD:refs/heads/$TARGET_REF"
            else
              git push github --force "refs/tags/$BITBUCKET_TAG:refs/tags/$TARGET_REF"
            fi

    - step: &wiki-synchronization
        # Sincronizza wiki/ con la GitHub Wiki, che GitHub espone come repo separato
        # (<repo>.wiki.git), non raggiunto dal mirror del codice sopra.
        # A differenza del mirror del codice qui non si preserva la storia: wiki/ nel
        # branch è la fonte di verità, quindi ad ogni run si sovrascrive il contenuto
        # del repo wiki e si committa/pusha solo se qualcosa è effettivamente cambiato.
        # Prerequisito una tantum: abilitare la Wiki dai Settings del repo GitHub
        # (altrimenti <repo>.wiki.git non esiste e il clone fallisce).
        name: GitHub Wiki Synchronization
        condition:
          changesets:
            includePaths:
              - "wiki/**"
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends git openssh-client ca-certificates
          - export GITHUB_WIKI_REPO_URL="${GITHUB_REPO_URL%.git}.wiki.git"
          - git clone --depth 1 "$GITHUB_WIKI_REPO_URL" /tmp/wiki-sync
          # Ripulisce il clone (tranne .git) e ci copia sopra il contenuto corrente di wiki/,
          # così il repo wiki riflette esattamente wiki/ nel branch appena sincronizzato.
          - find /tmp/wiki-sync -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          - cp wiki/*.md /tmp/wiki-sync/
          - cd /tmp/wiki-sync
          - git add -A
          - |
            if git diff --cached --quiet; then
              echo "Wiki invariata, nessun push necessario."
            else
              git -c user.name="Bitbucket Pipelines" -c user.email="pipelines@miriade.it" \
                commit -m "Sync wiki from ${BITBUCKET_COMMIT:0:12}"
              git push origin HEAD:master
            fi


pipelines:
  branches:
    feature/pipeline-ci:
      # - parallel:
      #     - step: *test-pg-17
      #     - step: *test-pg-18
      # - step: *package
      # - step: *inspect-artifacts
      - step: *github-synchronization
      - step: *wiki-synchronization

    develop:
      - parallel:
          - step: *test-pg-17
          - step: *test-pg-18
      - step: *github-synchronization
      - step: *wiki-synchronization

    master:
      - parallel:
          - step: *test-pg-17
          - step: *test-pg-18
      - step: *github-synchronization
      - step: *wiki-synchronization

  tags:
    'v*':
      - step: *github-synchronization