##############################################################################
# bitbucket-pipelines.yml
#
# CI/CD Pipeline for pg_vault_tde — Bitbucket Cloud
#
# Delegates all build and test logic to the containerised local pipeline
# (ci/scripts/run-all.sh) via `make ci-all`.
#
##############################################################################
image: ubuntu:24.04

definitions:
  caches:
    apt-pgdg: /var/cache/apt
  services:
    docker:
      memory: 7128

  steps:
    - step: &test-pg-17
        name: Testing — PostgreSQL 17
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends ca-certificates curl wget
          # Docker Compose
          - curl -fsSL https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          - chmod +x /usr/local/bin/docker-compose
          # Run test
          - export PG_VERSION=17
          - bash ci/scripts/run-all.sh $TEST_RUNALL_OPTIONS

    - step: &test-pg-18
        name: Testing — PostgreSQL 18
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends ca-certificates curl wget
          # Docker Compose
          - curl -fsSL https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          - chmod +x /usr/local/bin/docker-compose
          # Run test
          - export PG_VERSION=18
          - bash ci/scripts/run-all.sh $TEST_RUNALL_OPTIONS

    - step: &package
        name: Build and Package Artifacts
        size: 2x
        services:
          - docker
        script:
          - bash packaging/build_in_container.sh --all
        artifacts:
          - dist/**

    - step: &inspect-artifacts
        name: Inspect Artifacts
        script:
          - ls -la dist/

    - step: &github-synchronization
        # Sincronizza su GitHub: master->main, develop->develop, tag di versione (v*)->tag omonimo
        name: GitHub Synchronization
        script:
          - apt-get update && apt-get install -y rsync git openssh-client
          # Determina il ref di destinazione su GitHub in base al trigger Bitbucket
          - |
            if [ -n "$BITBUCKET_TAG" ]; then
              export TARGET_TYPE="tag"
              export TARGET_REF="$BITBUCKET_TAG"
            elif [ "$BITBUCKET_BRANCH" = "master" ]; then
              export TARGET_TYPE="branch"
              export TARGET_REF="main"
            else
              export TARGET_TYPE="branch"
              export TARGET_REF="$BITBUCKET_BRANCH"
            fi
            echo "Sync -> $TARGET_TYPE $TARGET_REF"
          # Prepara il clone GitHub agganciando il ref di base corretto (se già esiste)
          - |
            BASE_BRANCH="$TARGET_REF"
            [ "$TARGET_TYPE" = "tag" ] && BASE_BRANCH="main"
            git init -q github-repo
            cd github-repo
            git remote add origin "$GITHUB_REPO_URL"
            if git fetch --depth 1 origin "$BASE_BRANCH" 2>/dev/null; then
              git checkout -B "$BASE_BRANCH" FETCH_HEAD
            else
              git checkout --orphan "$BASE_BRANCH"
              git rm -rf . 2>/dev/null || true
            fi
            cd ..
          # Sincronizza file o directory di interesse
          - >
            rsync -av --delete
            --exclude='.git/'
            --exclude='github-repo/'
            --exclude='tmp_pgext/'
            --exclude='ci/'
            --exclude='packaging/'
            --exclude='bitbucket-pipelines.yml'
            ./ github-repo/
          # Git config, commit e push sul ref corretto
          - |
            cd github-repo
            git config user.name "Bitbucket Service Sync"
            git config user.email "bitbucket-sync@miriade.it"
            git add -A
            if [ "$TARGET_TYPE" = "branch" ]; then
              git commit -m "Sync $TARGET_REF da Bitbucket ($BITBUCKET_COMMIT)" || echo "Nessuna modifica da sincronizzare"
              git push origin "HEAD:refs/heads/$TARGET_REF"
            else
              git commit -m "Sync versione $TARGET_REF da Bitbucket ($BITBUCKET_COMMIT)" || echo "Nessuna modifica da sincronizzare"
              git tag -f "$TARGET_REF"
              git push origin "refs/tags/$TARGET_REF" --force
            fi


pipelines:
  branches:
    feature/pipeline-ci:
      # - parallel:
      #     - step: *test-pg-17
      #     - step: *test-pg-18
      # - step: *package
      # - step: *inspect-artifacts
      - step: *github-synchronization

    develop:
      - parallel:
          - step: *test-pg-17
          - step: *test-pg-18
      - step: *github-synchronization

    master:
      - parallel:
          - step: *test-pg-17
          - step: *test-pg-18
      - step: *github-synchronization

  tags:
    'v*':
      - step: *github-synchronization