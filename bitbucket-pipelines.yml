##############################################################################
# bitbucket-pipelines.yml
#
# CI/CD Pipeline for pg_vault_tde — Bitbucket Cloud
#
# Delegates all build and test logic to the containerised local pipeline
# (ci/scripts/run-all.sh) via `make ci-all`.
#
##############################################################################
image: ubuntu:24.04

definitions:
  caches:
    apt-pgdg: /var/cache/apt
  services:
    docker:
      memory: 7128

  steps:
    - step: &test-pg-17
        name: Testing — PostgreSQL 17
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends ca-certificates curl wget
          # Docker Compose
          - curl -fsSL https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          - chmod +x /usr/local/bin/docker-compose
          # Run test
          - export PG_VERSION=17
          - bash ci/scripts/run-all.sh $TEST_RUNALL_OPTIONS

    - step: &test-pg-18
        name: Testing — PostgreSQL 18
        size: 2x
        services:
          - docker
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends ca-certificates curl wget
          # Docker Compose
          - curl -fsSL https://github.com/docker/compose/releases/download/v5.1.2/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
          - chmod +x /usr/local/bin/docker-compose
          # Run test
          - export PG_VERSION=18
          - bash ci/scripts/run-all.sh $TEST_RUNALL_OPTIONS

    - step: &package
        name: Build and Package Artifacts
        size: 2x
        services:
          - docker
        script:
          - bash packaging/build_in_container.sh --all
        artifacts:
          - dist/**

    - step: &inspect-artifacts
        name: Inspect Artifacts
        script:
          - ls -la dist/

    - step: &github-synchronization
        # Sincronizza su GitHub: master->main, develop->develop, tag di versione (v*)->tag omonimo
        # Mirror reale (storia, autori, messaggi preservati) a partire da GITHUB_HISTORY_SINCE,
        # filtrando via git-filter-repo i path non destinati al repo pubblico (ci/, bitbucket-pipelines.yml).
        name: GitHub Synchronization
        clone:
          depth: full
        script:
          - apt-get update -qq
          - apt-get install -y --no-install-recommends git openssh-client ca-certificates python3-pip
          - pip install --break-system-packages --quiet git-filter-repo
          # Determina il ref di destinazione su GitHub in base al trigger Bitbucket
          - |
            if [ -n "$BITBUCKET_TAG" ]; then
              export TARGET_TYPE="tag"
              export TARGET_REF="$BITBUCKET_TAG"
            elif [ "$BITBUCKET_BRANCH" = "master" ]; then
              export TARGET_TYPE="branch"
              export TARGET_REF="main"
            else
              export TARGET_TYPE="branch"
              export TARGET_REF="$BITBUCKET_BRANCH"
            fi
            echo "Sync -> $TARGET_TYPE $TARGET_REF"
          # Individua il commit più vecchio non anteriore a GITHUB_HISTORY_SINCE: diventerà la
          # nuova radice della storia pubblicata. Fissa e nel passato, GITHUB_HISTORY_SINCE
          # risolve sempre allo stesso commit tra un'esecuzione e l'altra.
          - |
            export GITHUB_HISTORY_SINCE="${GITHUB_HISTORY_SINCE:-2026-07-01}"
            CUTOFF_COMMIT=$(git log --since="$GITHUB_HISTORY_SINCE" --reverse --format=%H | head -1)
            if [ -z "$CUTOFF_COMMIT" ]; then
              echo "Nessun commit da $GITHUB_HISTORY_SINCE in poi su questo ref, sincronizzo l'intera storia disponibile."
              export FILTER_REFS=""
            else
              echo "Storia pubblicata a partire da: $(git show -s --format='%h %ad %s' --date=short "$CUTOFF_COMMIT")"
              PARENT_COMMIT=$(git rev-parse "${CUTOFF_COMMIT}^" 2>/dev/null || true)
              if [ -n "$PARENT_COMMIT" ]; then
                export FILTER_REFS="${PARENT_COMMIT}..HEAD"
              else
                export FILTER_REFS=""
              fi
            fi
          # Riscrive la storia rimuovendo i path interni e troncandola a GITHUB_HISTORY_SINCE,
          # mantenendo autori/messaggi/date reali per i commit inclusi.
          # Deterministico: a parità di storia sorgente e di cutoff produce sempre gli stessi SHA
          # filtrati, quindi il push verso GitHub resta un fast-forward, senza bisogno di un
          # commit-map persistito.
          - |
            if [ -n "$FILTER_REFS" ]; then
              git filter-repo --force --invert-paths \
                --path ci \
                --path bitbucket-pipelines.yml \
                --refs "$FILTER_REFS"
            else
              git filter-repo --force --invert-paths \
                --path ci \
                --path bitbucket-pipelines.yml
            fi
          - git remote add github "$GITHUB_REPO_URL"
          # Push del ref reale (storia intatta) verso GitHub
          - |
            if [ "$TARGET_TYPE" = "branch" ]; then
              git push github --force "HEAD:refs/heads/$TARGET_REF"
            else
              git push github --force "refs/tags/$BITBUCKET_TAG:refs/tags/$TARGET_REF"
            fi


pipelines:
  branches:
    feature/pipeline-ci:
      # - parallel:
      #     - step: *test-pg-17
      #     - step: *test-pg-18
      # - step: *package
      # - step: *inspect-artifacts
      - step: *github-synchronization

    develop:
      - parallel:
          - step: *test-pg-17
          - step: *test-pg-18
      - step: *github-synchronization

    master:
      - parallel:
          - step: *test-pg-17
          - step: *test-pg-18
      - step: *github-synchronization

  tags:
    'v*':
      - step: *github-synchronization