##############################################################################
# .github/workflows/ci.yml
#
# CI/CD Pipeline for pg_vault_tde
# @DevOps  +  @QA
#
# Jobs:
#   1. build        – Compile extension (zero warnings gate)
#   2. regress      – Run pg_regress 24-test regression suite
#   3. tap          – Run TAP tests with a mock Vault (HTTP::Daemon)
#   4. isolation    – Run isolation tests (MVCC, key rotation concurrency)
#   5. memcheck     – Valgrind + AddressSanitizer memory safety check
#
# CRITICAL: pg_vault_tde MUST be loaded via shared_preload_libraries.
# Every test job must initialize its own cluster with this setting.
##############################################################################
name: pg_vault_tde CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  OPENSSL_MIN_VERSION: "3.0"

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Build (zero-warning gate)
  # Compile against PG 17 and PG 18 with -Wall -Wextra.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: "Build (PG ${{ matrix.pg }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libcurl4-openssl-dev \
            pkg-config curl ca-certificates gnupg

      - name: Install PostgreSQL ${{ matrix.pg }}
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }}

      - name: Compile extension (zero-warning gate)
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          # Compile: -Wall -Wextra are already in our Makefile.
          # Any warning here fails the build.
          make PG_CONFIG=$(which pg_config) 2>&1 | tee build.log
          if grep -qE '^.*: warning:' build.log; then
            echo "::error::Compilation produced warnings — zero-warning policy violated"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pg_vault_tde-build-pg${{ matrix.pg }}
          path: "*.so"
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: SQL Regression Tests (pg_regress — 24 tests)
  #
  # Initializes a dedicated PG cluster with shared_preload_libraries set,
  # because pg_vault_tde uses shmem_request_hook / shmem_startup_hook which
  # require the extension to be preloaded at server start.
  # ──────────────────────────────────────────────────────────────────────────
  regress:
    name: "Regression (PG ${{ matrix.pg }})"
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]

    env:
      PGPORT: "15432"
      PGDATA: "/tmp/tde_regress_data"

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }}
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libssl-dev libcurl4-openssl-dev pkg-config

      - name: Build and install extension
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          make PG_CONFIG=$(which pg_config)
          sudo make install PG_CONFIG=$(which pg_config)

      - name: Initialize test cluster with shared_preload_libraries
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          # Stop the default PGDG cluster to free port 5432 and avoid conflicts
          sudo pg_ctlcluster ${{ matrix.pg }} main stop 2>/dev/null || true
          # Create a fresh cluster owned by the CI user
          initdb -D "$PGDATA" --no-locale -E UTF8
          # Configure shared_preload_libraries — REQUIRED for shmem hooks
          cat >> "$PGDATA/postgresql.conf" <<EOF
          shared_preload_libraries = 'pg_vault_tde'
          port = $PGPORT
          log_min_messages = warning
          EOF
          pg_ctl -D "$PGDATA" -l "$PGDATA/logfile" start
          # Wait for startup (shmem hooks execute here)
          pg_isready -p $PGPORT -t 30
          createdb -p $PGPORT regression_tde

      - name: Run pg_regress (24 tests)
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          make installcheck \
            PGPORT=$PGPORT \
            PGDATABASE=regression_tde \
            PG_CONFIG=$(which pg_config) \
            REGRESS_OPTS="--dbname=regression_tde --port=$PGPORT"

      - name: Show server log on failure
        if: failure()
        run: cat "$PGDATA/logfile" || true

      - name: Upload regression diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs-pg${{ matrix.pg }}
          path: |
            regression.diffs
            results/

      - name: Teardown cluster
        if: always()
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          pg_ctl -D "$PGDATA" stop -m immediate 2>/dev/null || true

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: TAP Tests with mock Vault
  # Uses HTTP::Daemon Perl module to mock the Vault HTTP API.
  # TAP tests manage their own PG instances via PostgreSQL::Test::Cluster.
  # ──────────────────────────────────────────────────────────────────────────
  tap:
    name: "TAP Tests (PG ${{ matrix.pg }})"
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }} + Perl modules
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libssl-dev libcurl4-openssl-dev pkg-config \
            perl cpanminus
          sudo cpanm --notest \
            Test::More \
            HTTP::Daemon \
            HTTP::Response \
            IPC::Run

      - name: Build and install extension
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          make PG_CONFIG=$(which pg_config)
          sudo make install PG_CONFIG=$(which pg_config)

      - name: Run TAP tests
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          # TAP tests use PostgreSQL::Test::Cluster which manages its own
          # initdb + pg_ctl lifecycle; shared_preload_libraries is set in the
          # test scripts via $node->append_conf().
          prove -v tap/

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: Isolation Tests (race conditions, MVCC, key rotation)
  # ──────────────────────────────────────────────────────────────────────────
  isolation:
    name: "Isolation Tests (PG ${{ matrix.pg }})"
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        pg: ["17", "18"]

    env:
      PGPORT: "15433"
      PGDATA: "/tmp/tde_isolation_data"

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ matrix.pg }}
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            libssl-dev libcurl4-openssl-dev pkg-config

      - name: Build and install extension
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          make PG_CONFIG=$(which pg_config)
          sudo make install PG_CONFIG=$(which pg_config)

      - name: Initialize test cluster
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          sudo pg_ctlcluster ${{ matrix.pg }} main stop 2>/dev/null || true
          initdb -D "$PGDATA" --no-locale -E UTF8
          cat >> "$PGDATA/postgresql.conf" <<EOF
          shared_preload_libraries = 'pg_vault_tde'
          port = $PGPORT
          max_prepared_transactions = 10
          EOF
          pg_ctl -D "$PGDATA" -l "$PGDATA/logfile" start
          pg_isready -p $PGPORT -t 30
          createdb -p $PGPORT isolation_tde

      - name: Run isolation tests
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          make installcheck-isolation \
            PGPORT=$PGPORT \
            PG_CONFIG=$(which pg_config) \
            ISOLATION_OPTS="--dbname=isolation_tde --port=$PGPORT"

      - name: Show server log on failure
        if: failure()
        run: cat "$PGDATA/logfile" || true

      - name: Teardown cluster
        if: always()
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"
          pg_ctl -D "$PGDATA" stop -m immediate 2>/dev/null || true

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5: Memory Safety Check (Valgrind + AddressSanitizer)
  # Builds a separate ASan-instrumented binary and runs the regress suite
  # under Valgrind to catch palloc misuse, buffer overflows, use-after-free.
  # Only runs on PG 18 to keep CI time reasonable.
  # ──────────────────────────────────────────────────────────────────────────
  memcheck:
    name: "Memory Safety (Valgrind + ASan)"
    runs-on: ubuntu-24.04
    needs: build

    env:
      PG_VERSION: "18"
      PGPORT: "15434"
      PGDATA: "/tmp/tde_memcheck_data"

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL ${{ env.PG_VERSION }} + Valgrind
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            postgresql-${{ env.PG_VERSION }} \
            postgresql-server-dev-${{ env.PG_VERSION }} \
            libssl-dev libcurl4-openssl-dev pkg-config \
            valgrind

      - name: Build with AddressSanitizer
        run: |
          export PATH="/usr/lib/postgresql/${{ env.PG_VERSION }}/bin:$PATH"
          make clean
          make PG_CONFIG=$(which pg_config) \
               CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
               SHLIB_LINK="-lasan"
          sudo make install PG_CONFIG=$(which pg_config)

      - name: Initialize test cluster for memcheck
        run: |
          export PATH="/usr/lib/postgresql/${{ env.PG_VERSION }}/bin:$PATH"
          sudo pg_ctlcluster ${{ env.PG_VERSION }} main stop 2>/dev/null || true
          initdb -D "$PGDATA" --no-locale -E UTF8
          cat >> "$PGDATA/postgresql.conf" <<EOF
          shared_preload_libraries = 'pg_vault_tde'
          port = $PGPORT
          log_min_messages = warning
          EOF
          pg_ctl -D "$PGDATA" -l "$PGDATA/logfile" start
          pg_isready -p $PGPORT -t 30
          createdb -p $PGPORT memcheck_tde

      - name: Run regression suite under Valgrind
        run: |
          export PATH="/usr/lib/postgresql/${{ env.PG_VERSION }}/bin:$PATH"
          make installcheck \
            PGPORT=$PGPORT \
            PGDATABASE=memcheck_tde \
            PG_CONFIG=$(which pg_config) \
            REGRESS_OPTS="--dbname=memcheck_tde --port=$PGPORT"
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:log_path=/tmp/asan.log"

      - name: Show server log on failure
        if: failure()
        run: |
          cat "$PGDATA/logfile" || true
          cat /tmp/asan.log* 2>/dev/null || true

      - name: Upload memcheck output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: memcheck-output
          path: |
            /tmp/asan.log*
            regression.diffs

      - name: Teardown cluster
        if: always()
        run: |
          export PATH="/usr/lib/postgresql/${{ env.PG_VERSION }}/bin:$PATH"
          pg_ctl -D "$PGDATA" stop -m immediate 2>/dev/null || true
