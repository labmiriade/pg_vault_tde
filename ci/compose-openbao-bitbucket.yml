# ci/compose-openbao.yml — OpenBao multi-node integration test environment
#
# Provides a realistic KMS environment with a 3-node OpenBao Raft HA cluster
# (Integrated Storage) and a pg_vault_tde PostgreSQL instance that
# authenticates via AppRole.
#
# Services:
#   bao-1        — OpenBao Raft node (first to be initialised → leader)
#   bao-2        — OpenBao Raft node (auto-joins via retry_join)
#   bao-3        — OpenBao Raft node (auto-joins via retry_join)
#   bao-init     — One-shot init container: operator init + unseal all nodes,
#                  then bootstraps transit + AppRole
#   pg-bao       — PostgreSQL + pg_vault_tde, auth_method=approle
#
# Usage:
#   podman-compose -f ci/compose-openbao.yml up -d
#   podman-compose -f ci/compose-openbao.yml down -v
#
# Design notes:
#   * Nodes run real production mode (`bao server -config=...`) with a Raft
#     storage stanza — NOT dev mode (dev mode is in-memory single-node and
#     cannot form a Raft cluster). The HCL configs live in ci/openbao/.
#   * The command is `bao server ...` (not `server ...`) on purpose: the image
#     entrypoint special-cases a bare `server` arg by injecting dev-only flags
#     (-dev-root-token-id / -dev-listen-address), which crash a production node.
#     Leading `bao` bypasses that injection while keeping the chown/drop-root.
#   * This file exists only for Bitbucket Pipelines: it bind-mounts the Raft
#     storage under the clone dir because the Pipelines docker daemon refuses
#     named volumes ("-v only supports $BITBUCKET_CLONE_DIR and its
#     subdirectories").  Do NOT merge it back into compose-openbao.yml.
#   * SKIP_CHOWN=1 on the nodes: the image entrypoint chowns /openbao/file to
#     uid 100 under `set -e`, and Pipelines runs dockerd with user namespaces
#     remapped, so that chown always fails with EPERM on a bind mount and every
#     node dies at boot.  run-openbao.sh pre-creates the bind sources 0777
#     instead — mode bits survive the remap, ownership does not.
#   * bao-init breaks the chicken-and-egg (nodes are sealed until init unseals
#     them) by depending on `service_started`, not `service_healthy`.
#
# Copyright (c) 2026 Miriade S.r.l. — PostgreSQL License (BSD)

services:

  # ── OpenBao node 1 ─────────────────────────────────────────────────────
  bao-1:
    image: ${OPENBAO_IMAGE:-docker.io/openbao/openbao:2}
    container_name: bao-1
    hostname: bao-1
    command: ["bao", "server", "-config=/openbao/config/main.hcl"]
    environment:
      SKIP_CHOWN: "1"          # see header note — the entrypoint chown is fatal here
    ports:
      - "${BAO_PORT_1:-18200}:8200"
    volumes:
      - ./openbao/bao-1.hcl:/openbao/config/main.hcl:ro
      - ./docker-data/bao-1-file:/openbao/file
    healthcheck:
      test:
        - "CMD-SHELL"
        - wget -qO- 'http://localhost:8200/v1/sys/health?standbyok=true' | grep -q '"sealed":false'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - tde-bao

  # ── OpenBao node 2 ─────────────────────────────────────────────────────
  bao-2:
    image: ${OPENBAO_IMAGE:-docker.io/openbao/openbao:2}
    container_name: bao-2
    hostname: bao-2
    command: ["bao", "server", "-config=/openbao/config/main.hcl"]
    environment:
      SKIP_CHOWN: "1"          # see header note — the entrypoint chown is fatal here
    ports:
      - "${BAO_PORT_2:-18201}:8200"
    volumes:
      - ./openbao/bao-2.hcl:/openbao/config/main.hcl:ro
      - ./docker-data/bao-2-file:/openbao/file
    depends_on:
      bao-1:
        condition: service_started
    healthcheck:
      test:
        - "CMD-SHELL"
        - wget -qO- 'http://localhost:8200/v1/sys/health?standbyok=true' | grep -q '"sealed":false'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - tde-bao

  # ── OpenBao node 3 ─────────────────────────────────────────────────────
  bao-3:
    image: ${OPENBAO_IMAGE:-docker.io/openbao/openbao:2}
    container_name: bao-3
    hostname: bao-3
    command: ["bao", "server", "-config=/openbao/config/main.hcl"]
    environment:
      SKIP_CHOWN: "1"          # see header note — the entrypoint chown is fatal here
    ports:
      - "${BAO_PORT_3:-18202}:8200"
    volumes:
      - ./openbao/bao-3.hcl:/openbao/config/main.hcl:ro
      - ./docker-data/bao-3-file:/openbao/file
    depends_on:
      bao-1:
        condition: service_started
    healthcheck:
      test:
        - "CMD-SHELL"
        - wget -qO- 'http://localhost:8200/v1/sys/health?standbyok=true' | grep -q '"sealed":false'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - tde-bao

  # ── Bootstrap container ─────────────────────────────────────────────────
  # operator init bao-1, unseal every node (followers auto-join via retry_join),
  # then enable transit + AppRole and publish AppRole creds to a shared volume.
  # Exits 0 when complete.
  bao-init:
    image: ${OPENBAO_IMAGE:-docker.io/openbao/openbao:2}
    container_name: bao-init
    environment:
      BAO_ADDR: http://bao-1:8200
      TDE_MOUNT: ${BAO_MOUNT:-transit}
      TDE_KEY: ${BAO_KEY_NAME:-pg-tde-dek}
      TDE_ROLE: tde-role
      TDE_POLICY: tde-policy
    volumes:
      - ./docker-data/bao-init-data:/openbao/init
    depends_on:
      bao-1:
        condition: service_started
      bao-2:
        condition: service_started
      bao-3:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        SHARED=/openbao/init
        mkdir -p $$SHARED

        echo "[bao-init] Waiting for bao-1 API ..."
        for i in $$(seq 1 60); do
          if wget -qO- "$$BAO_ADDR/v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true" >/dev/null 2>&1; then
            break
          fi
          echo "[bao-init] waiting for bao-1 ($$i/60) ..."
          sleep 2
        done

        STATUS=$$(bao status -address=$$BAO_ADDR 2>/dev/null || true)
        if echo "$$STATUS" | grep -q 'Initialized.*true'; then
          echo "[bao-init] Cluster already initialised, reusing saved keys ..."
          UNSEAL_KEY=$$(cat $$SHARED/unseal_key)
          ROOT_TOKEN=$$(cat $$SHARED/root_token)
        else
          echo "[bao-init] Initialising bao-1 (1 key share) ..."
          INIT=$$(bao operator init -address=$$BAO_ADDR -key-shares=1 -key-threshold=1)
          UNSEAL_KEY=$$(echo "$$INIT" | grep 'Unseal Key 1:'      | awk '{print $$NF}')
          ROOT_TOKEN=$$(echo "$$INIT" | grep 'Initial Root Token:' | awk '{print $$NF}')
          printf '%s\n' "$$UNSEAL_KEY" > $$SHARED/unseal_key
          printf '%s\n' "$$ROOT_TOKEN" > $$SHARED/root_token
        fi

        echo "[bao-init] Unsealing bao-1 (leader) ..."
        bao operator unseal -address=http://bao-1:8200 "$$UNSEAL_KEY" >/dev/null

        for node in bao-2 bao-3; do
          echo "[bao-init] Unsealing $$node (auto-joins via retry_join) ..."
          for i in $$(seq 1 30); do
            if bao operator unseal -address=http://$$node:8200 "$$UNSEAL_KEY" >/dev/null 2>&1; then
              echo "[bao-init] $$node unsealed."
              break
            fi
            echo "[bao-init] $$node not ready to unseal ($$i/30) ..."
            sleep 2
          done
        done

        export BAO_ADDR=http://bao-1:8200
        export BAO_TOKEN=$$ROOT_TOKEN

        echo "[bao-init] Enabling transit secrets engine at $$TDE_MOUNT ..."
        bao secrets enable -address=$$BAO_ADDR -path=$$TDE_MOUNT transit || true

        echo "[bao-init] Creating TDE encryption key ..."
        bao write -address=$$BAO_ADDR $$TDE_MOUNT/keys/$$TDE_KEY type=aes256-gcm96 || true

        echo "[bao-init] Writing TDE policy ..."
        bao policy write -address=$$BAO_ADDR $$TDE_POLICY - <<'POLICY'
        path "transit/encrypt/pg-tde-dek" {
          capabilities = ["create", "update"]
        }
        path "transit/decrypt/pg-tde-dek" {
          capabilities = ["create", "update"]
        }
        path "transit/rewrap/pg-tde-dek" {
          capabilities = ["create", "update"]
        }
        path "transit/keys/pg-tde-dek/rotate" {
          capabilities = ["create", "update"] 
        }
        path "sys/health" {
          capabilities = ["read"]
        }
        path "auth/token/renew-self" {
          capabilities = ["update"]
        }
        POLICY

        echo "[bao-init] Enabling AppRole auth ..."
        bao auth enable -address=$$BAO_ADDR approle || true

        echo "[bao-init] Creating AppRole role ..."
        bao write -address=$$BAO_ADDR auth/approle/role/$$TDE_ROLE \
          secret_id_ttl=0 \
          token_ttl=1h \
          token_max_ttl=24h \
          token_policies=$$TDE_POLICY

        echo "[bao-init] Fetching role_id ..."
        ROLE_ID=$$(bao read -address=$$BAO_ADDR -field=role_id auth/approle/role/$$TDE_ROLE/role-id)

        echo "[bao-init] Generating secret_id ..."
        SECRET_ID=$$(bao write -address=$$BAO_ADDR -field=secret_id -f auth/approle/role/$$TDE_ROLE/secret-id)

        echo "[bao-init] Writing credentials to shared volume ..."
        printf 'BAO_ROLE_ID=%s\nBAO_SECRET_ID=%s\n' "$$ROLE_ID" "$$SECRET_ID" > $$SHARED/approle.env
        printf '%s\n' "$$ROLE_ID"   > $$SHARED/role_id
        printf '%s\n' "$$SECRET_ID" > $$SHARED/secret_id

        echo "[bao-init] Bootstrap complete."
        echo "  role_id:   $$ROLE_ID"
        echo "  secret_id: (written to $$SHARED/secret_id)"
    networks:
      - tde-bao

  # ── PostgreSQL + pg_vault_tde (AppRole auth, pointing at bao-1) ─────────
  pg-bao:
    build:
      context: ..
      dockerfile: ci/containers/pg-test.Containerfile
    image: ${PG_TEST_IMAGE:-pg-tde-test}:latest
    container_name: pg-tde-bao
    environment:
      POSTGRES_PASSWORD: postgres
      BAO_ADDR: http://bao-1:8200
    volumes:
      - ./docker-data/bao-init-data:/openbao/init:ro
    command: 
      - bash
      - -c
      - |
        set -e
        echo "[pg-bao] Waiting for AppRole credentials from bao-init ..."
        for i in $(seq 1 60); do
          if [ -f /openbao/init/role_id ] && [ -f /openbao/init/secret_id ]; then
            break
          fi
          echo "[pg-bao] Attempt $$i/60 ..."
          sleep 2
        done

        ROLE_ID=$$(cat /openbao/init/role_id)
        SECRET_ID=$$(cat /openbao/init/secret_id)
        echo "[pg-bao] Credentials loaded. Starting PostgreSQL ..."

        exec docker-entrypoint.sh postgres \
          -c shared_preload_libraries=pg_vault_tde \
          -c pg_vault_tde.kms_provider=vault \
          -c pg_vault_tde.vault_url=http://bao-1:8200 \
          -c pg_vault_tde.vault_auth_method=approle \
          -c pg_vault_tde.vault_role_id=$$ROLE_ID \
          -c pg_vault_tde.vault_secret_id=$$SECRET_ID \
          -c pg_vault_tde.vault_transit_mount=${BAO_MOUNT:-transit} \
          -c pg_vault_tde.vault_key_name=${BAO_KEY_NAME:-pg-tde-dek} \
          -c pg_vault_tde.bgw_enabled=on \
          -c pg_vault_tde.token_renewal_interval=120 \
          -c log_min_messages=warning
    ports:
      - "${PG_BAO_PORT:-18432}:5432"
    depends_on:
      bao-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - tde-bao

# volumes:
#   bao-1-file:
#   bao-2-file:
#   bao-3-file:
#   bao-init-data:

networks:
  tde-bao:
    driver: bridge
