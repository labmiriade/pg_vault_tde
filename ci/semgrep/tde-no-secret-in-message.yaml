rules:
  - id: tde-no-secret-in-message
    languages: [c]
    severity: ERROR
    message: >-
      $X holds a secret and must not reach an error message, a log line or the
      client: messages go to the server log, to the client, and on to wherever
      those are shipped.
    patterns:
      - pattern-either:
          - pattern: errmsg(..., $X, ...)
          - pattern: errmsg_internal(..., $X, ...)
          - pattern: errdetail(..., $X, ...)
          - pattern: errdetail_log(..., $X, ...)
          - pattern: errhint(..., $X, ...)
          - pattern: elog($L, ..., $X, ...)
          - pattern: pg_log_error(..., $X, ...)
          - pattern: pg_log_warning(..., $X, ...)
          - pattern: pg_log_info(..., $X, ...)
          - pattern: fprintf($F, ..., $X, ...)
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(\w+_)?(pass|passphrase|pw|dek|kek|secret|secret_id|pin|vault_token)$
